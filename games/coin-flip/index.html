<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yazı Tura</title><style>body{background:#090d18;color:white;font:18px Arial;display:grid;place-items:center;min-height:100vh;margin:0}.box{text-align:center;background:#111827;padding:32px;border-radius:18px}button{padding:13px 20px;background:#7957ff;color:#fff;border:0;border-radius:9px;margin:8px;cursor:pointer}a{color:#b8a8ff}#coin{font-size:90px;margin:20px}</style><div class="box"><h1>🪙 Yazı Tura</h1><p>Tahmin et:</p><button onclick="flip('Yazı')">Yazı</button><button onclick="flip('Tura')">Tura</button><div id="coin">🪙</div><p id="result">Hazır mısın?</p><p id="score">Doğru: 0 · Yanlış: 0</p><a href="../../index.html">Ana sayfa</a></div><script>let yes=0,no=0;function flip(g){const r=Math.random()<.5?'Yazı':'Tura';document.querySelector('#coin').textContent=r==='Yazı'?'🌕':'🌑';document.querySelector('#result').textContent=r===g?'Doğru tahmin! 🎉':'Bu kez '+r+' geldi.';r===g?yes++:no++;document.querySelector('#score').textContent='Doğru: '+yes+' · Yanlış: '+no}</script></html>
