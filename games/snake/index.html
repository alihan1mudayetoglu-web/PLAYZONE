
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake | PLAYZONE</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #090d18;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.game-container {
    width: 100%;
    max-width: 500px;
    text-align: center;
}

.back {
    display: inline-block;
    color: #aaa;
    text-decoration: none;
    margin-bottom: 20px;
}

.back:hover {
    color: #8b6cff;
}

h1 {
    font-size: 35px;
    margin-bottom: 10px;
}

h1 span {
    color: #7957ff;
}

.subtitle {
    color: #929bb0;
    margin-bottom: 22px;
}

.scores {
    display: flex;
    gap: 12px;
    margin-bottom: 15px;
}

.score-box {
    background: #151e30;
    border: 1px solid #28344a;
    padding: 14px;
    flex: 1;
    border-radius: 12px;
}

.score-box p {
    color: #929bb0;
    font-size: 12px;
    margin-bottom: 7px;
}

.score-box strong {
    font-size: 23px;
    color: #a58fff;
}

.canvas-wrapper {
    position: relative;
    width: 100%;
    background: #111827;
    border: 2px solid #34435c;
    border-radius: 12px;
    overflow: hidden;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
}

.overlay {
    position: absolute;
    inset: 0;
    background: #080d18df;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px;
}

.overlay.hidden {
    display: none;
}

.overlay h2 {
    font-size: 30px;
}

.overlay p {
    color: #b1b9cb;
}

button {
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.main-btn {
    background: #7957ff;
    color: white;
    padding: 14px 28px;
    border-radius: 9px;
    font-size: 15px;
}

.main-btn:hover {
    background: #9279ff;
}

.controls {
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(2, 55px);
    justify-content: center;
    gap: 7px;
    margin-top: 22px;
}

.controls button {
    background: #1a2540;
    color: white;
    border: 1px solid #354366;
    border-radius: 10px;
    font-size: 23px;
}

.controls button:active {
    background: #7957ff;
}

.up { grid-column: 2; grid-row: 1; }
.left { grid-column: 1; grid-row: 2; }
.down { grid-column: 2; grid-row: 2; }
.right { grid-column: 3; grid-row: 2; }

.tip {
    margin-top: 20px;
    color: #929bb0;
    font-size: 13px;
    line-height: 1.7;
}

</style>
</head>

<body>

<div class="game-container">

<a href="../../index.html" class="back">← Ana Sayfaya Dön</a>

<h1>🐍 <span>Snake</span></h1>
<p class="subtitle">Yemleri topla, büyü ve rekor kır!</p>

<div class="scores">
    <div class="score-box">
        <p>SKOR</p>
        <strong id="score">0</strong>
    </div>

    <div class="score-box">
        <p>EN YÜKSEK SKOR</p>
        <strong id="best">0</strong>
    </div>
</div>

<div class="canvas-wrapper">

<canvas id="game" width="400" height="400"></canvas>

<div class="overlay" id="overlay">
    <h2 id="overlayTitle">🐍 Snake</h2>
    <p id="overlayText">Yılanı kontrol etmeye hazır mısın?</p>
    <button class="main-btn" id="startBtn">Oyuna Başla</button>
</div>

</div>

<div class="controls">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="down" data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
</div>

<p class="tip">
    Bilgisayar: Yön tuşları veya WASD<br>
    Telefon: Ekrandaki yön tuşlarını kullan.
</p>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const size = 20;
const count = 20;

let snake, food, direction, nextDirection;
let score = 0;
let timer = null;
let playing = false;

let best = Number(localStorage.getItem("snakeBest")) || 0;

const scoreElement = document.getElementById("score");
const bestElement = document.getElementById("best");
const overlay = document.getElementById("overlay");
const startBtn = document.getElementById("startBtn");

bestElement.textContent = best;

function randomFood() {
    let position;

    do {
        position = {
            x: Math.floor(Math.random() * count),
            y: Math.floor(Math.random() * count)
        };
    } while (snake.some(part =>
        part.x === position.x && part.y === position.y
    ));

    return position;
}

function draw() {
    ctx.fillStyle = "#111827";
    ctx.fillRect(0, 0, 400, 400);

    // Izgara
    ctx.strokeStyle = "#1d293c";
    ctx.lineWidth = 1;

    for (let i = 0; i <= 400; i += size) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, 400);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(400, i);
        ctx.stroke();
    }

    // Yem
    ctx.fillStyle = "#ff5577";
    ctx.beginPath();
    ctx.arc(
        food.x * size + 10,
        food.y * size + 10,
        8,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Yılan
    snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#a78bfa" : "#7957ff";

        ctx.beginPath();
        ctx.roundRect(
            part.x * size + 1,
            part.y * size + 1,
            size - 2,
            size - 2,
            5
        );
        ctx.fill();
    });
}

function startGame() {
    clearInterval(timer);

    snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
    ];

    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };

    score = 0;
    scoreElement.textContent = score;

    food = randomFood();

    playing = true;
    overlay.classList.add("hidden");

    draw();

    timer = setInterval(update, 130);
}

function update() {
    if (!playing) return;

    direction = nextDirection;

    const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };

    const eating = head.x === food.x && head.y === food.y;

    // Duvara çarpma
    if (
        head.x < 0 || head.x >= count ||
        head.y < 0 || head.y >= count
    ) {
        gameOver();
        return;
    }

    // Kendine çarpma
    const body = eating ? snake : snake.slice(0, -1);

    if (body.some(part =>
        part.x === head.x && part.y === head.y
    )) {
        gameOver();
        return;
    }

    snake.unshift(head);

    if (eating) {
        score += 10;
        scoreElement.textContent = score;

        if (score > best) {
            best = score;
            bestElement.textContent = best;
            localStorage.setItem("snakeBest", best);
        }

        food = randomFood();
    } else {
        snake.pop();
    }

    draw();
}

function gameOver() {
    playing = false;
    clearInterval(timer);

    document.getElementById("overlayTitle").textContent = "Oyun Bitti!";
    document.getElementById("overlayText").textContent =
        "Skorun: " + score;

    startBtn.textContent = "Tekrar Oyna";
    overlay.classList.remove("hidden");
}

function changeDirection(dir) {
    if (!playing) return;

    const directions = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
    };

    const newDir = directions[dir];

    if (
        newDir.x === -direction.x &&
        newDir.y === -direction.y
    ) return;

    nextDirection = newDir;
}

document.addEventListener("keydown", e => {
    const keys = {
        ArrowUp: "up",
        w: "up",
        ArrowDown: "down",
        s: "down",
        ArrowLeft: "left",
        a: "left",
        ArrowRight: "right",
        d: "right"
    };

    if (keys[e.key]) {
        e.preventDefault();
        changeDirection(keys[e.key]);
    }
});

document.querySelectorAll(".controls button").forEach(btn => {
    btn.addEventListener("click", () => {
        changeDirection(btn.dataset.dir);
    });
});

startBtn.addEventListener("click", startGame);

draw();

</script>

</body>
</html>
