
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Cards | PLAYZONE</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090d18;color:white;
 font-family:Arial,sans-serif;text-align:center;padding:25px;
}
a{color:#a995ff;text-decoration:none}
header{display:flex;justify-content:space-between;max-width:750px;margin:auto}
main{
 max-width:650px;margin:45px auto;background:#141c2c;
 padding:25px;border-radius:20px;border:1px solid #303b52;
}
h1{font-size:35px}
.stats{display:flex;justify-content:center;gap:15px;margin:25px}
.stat{background:#090d18;padding:15px;border-radius:12px}
.stat b{font-size:22px;margin-left:8px}
button{
 background:#7957ff;color:white;border:0;padding:13px 22px;
 border-radius:10px;font-weight:bold;cursor:pointer;
}
.board{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:12px;max-width:440px;margin:25px auto;
}
.card{
 aspect-ratio:1;background:#282344;border:1px solid #51447f;
 border-radius:14px;color:white;font-size:40px;cursor:pointer;
}
.card.open,.card.matched{background:#47368a}
.card.matched{opacity:.5;cursor:default}
#message{color:#c4b5fd;min-height:25px}
@media(max-width:450px){
 .board{gap:7px}.card{font-size:29px}
}
</style>
</head>
<body>

<header>
<a href="../../index.html"><b>PLAYZONE</b></a>
<a href="../../index.html">← Ana Sayfa</a>
</header>

<main>
<h1>🧠 Memory Cards</h1>
<p>Aynı görselleri eşleştir!</p>

<div class="stats">
<div class="stat">HAMLE <b id="moves">0</b></div>
<div class="stat">EŞLEŞME <b id="pairs">0/8</b></div>
</div>

<button id="restart">Yeni Oyun</button>

<div class="board" id="board"></div>
<div id="message">Kartları eşleştirmeye başla!</div>
</main>

<script>
const icons=["🚀","🐱","⚽","🍕","🎮","⭐","🦊","🍉"];

const board=document.getElementById("board");
const movesEl=document.getElementById("moves");
const pairsEl=document.getElementById("pairs");
const message=document.getElementById("message");

let first=null;
let lock=false;
let moves=0;
let pairs=0;

function shuffle(array){
 for(let i=array.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [array[i],array[j]]=[array[j],array[i]];
 }
 return array;
}

function setup(){
 board.innerHTML="";
 first=null;
 lock=false;
 moves=0;
 pairs=0;

 movesEl.textContent=0;
 pairsEl.textContent="0/8";
 message.textContent="Kartları eşleştir!";

 const cards=shuffle([...icons,...icons]);

 cards.forEach(icon=>{
  const card=document.createElement("button");
  card.className="card";
  card.textContent="?";
  card.dataset.icon=icon;

  card.onclick=()=>flip(card);

  board.appendChild(card);
 });
}

function flip(card){
 if(lock || card.classList.contains("open") ||
 card.classList.contains("matched"))return;

 card.classList.add("open");
 card.textContent=card.dataset.icon;

 if(!first){
  first=card;
  return;
 }

 moves++;
 movesEl.textContent=moves;

 if(first.dataset.icon===card.dataset.icon){
  first.classList.add("matched");
  card.classList.add("matched");

  first=null;
  pairs++;

  pairsEl.textContent=pairs+"/8";

  if(pairs===8){
   message.textContent="🎉 Tebrikler! "+moves+" hamlede bitirdin!";
  }
 }else{
  lock=true;
  const previous=first;
  first=null;

  setTimeout(()=>{
   previous.classList.remove("open");
   card.classList.remove("open");

   previous.textContent="?";
   card.textContent="?";

   lock=false;
  },750);
 }
}

document.getElementById("restart").onclick=setup;

setup();
</script>
</body>
</html>
