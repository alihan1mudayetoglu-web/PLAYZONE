
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Shooter | PLAYZONE</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090d18;color:white;
 font-family:Arial,sans-serif;text-align:center;padding:20px;
}
a{color:#a995ff;text-decoration:none}
header{display:flex;justify-content:space-between;max-width:800px;margin:auto}
main{
 max-width:750px;margin:35px auto;background:#141c2c;
 padding:20px;border-radius:20px;border:1px solid #303b52;
}
h1{font-size:35px}
.hud{display:flex;justify-content:center;gap:30px;margin:15px}
canvas{
 display:block;width:100%;max-width:620px;height:auto;
 background:#050916;border:1px solid #303954;
 border-radius:12px;margin:15px auto;
 touch-action:none;
}
button{
 background:#7957ff;color:white;border:0;padding:13px 20px;
 border-radius:10px;font-weight:bold;cursor:pointer;
}
.controls{display:flex;justify-content:center;gap:12px;margin:15px}
.controls button{min-width:65px}
#message{color:#c4b5fd;min-height:24px}
</style>
</head>
<body>

<header>
<a href="../../index.html"><b>PLAYZONE</b></a>
<a href="../../index.html">← Ana Sayfa</a>
</header>

<main>
<h1>🚀 Space Shooter</h1>
<p>Uzay gemini kontrol et ve düşmanları yok et!</p>

<div class="hud">
<span>PUAN: <b id="score">0</b></span>
<span>CAN: <b id="lives">3</b></span>
</div>

<canvas id="game" width="620" height="420"></canvas>

<button id="start">Oyuna Başla</button>

<div id="message">Başlamak için butona bas!</div>

<div class="controls">
<button id="left">◀</button>
<button id="fire">ATEŞ</button>
<button id="right">▶</button>
</div>

<p>Bilgisayar: ← → hareket, SPACE ateş.</p>
</main>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const scoreEl=document.getElementById("score");
const livesEl=document.getElementById("lives");
const message=document.getElementById("message");
const startBtn=document.getElementById("start");

let player,bullets,enemies,stars;
let score,lives,running=false;
let keys={};
let lastShot=0,lastSpawn=0;
let animation;

function reset(){
 player={x:310,y:370,w:34,h:28,speed:5};
 bullets=[];
 enemies=[];
 score=0;
 lives=3;

 stars=Array.from({length:65},()=>({
  x:Math.random()*620,
  y:Math.random()*420,
  s:Math.random()*2+1
 }));

 scoreEl.textContent=0;
 livesEl.textContent=3;
}

function drawShip(){
 ctx.fillStyle="#9b82ff";
 ctx.beginPath();
 ctx.moveTo(player.x,player.y-14);
 ctx.lineTo(player.x-17,player.y+14);
 ctx.lineTo(player.x,player.y+7);
 ctx.lineTo(player.x+17,player.y+14);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle="#5eead4";
 ctx.fillRect(player.x-4,player.y+8,8,10);
}

function draw(){
 ctx.clearRect(0,0,620,420);

 ctx.fillStyle="white";

 stars.forEach(s=>{
  ctx.globalAlpha=.6;
  ctx.fillRect(s.x,s.y,s.s,s.s);
  s.y+=s.s*.45;

  if(s.y>420){
   s.y=0;
   s.x=Math.random()*620;
  }
 });

 ctx.globalAlpha=1;

 bullets.forEach(b=>{
  ctx.fillStyle="#5eead4";
  ctx.fillRect(b.x-2,b.y-9,4,12);
 });

 enemies.forEach(e=>{
  ctx.fillStyle="#fb7185";
  ctx.beginPath();
  ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
  ctx.fill();
 });

 drawShip();

 if(!running){
  ctx.fillStyle="#c4b5fd";
  ctx.font="bold 24px Arial";
  ctx.textAlign="center";
  ctx.fillText("SPACE SHOOTER",310,190);
 }
}

function endGame(){
 running=false;
 cancelAnimationFrame(animation);
 message.textContent="Oyun bitti! Puanın: "+score;
 startBtn.disabled=false;
 startBtn.textContent="Tekrar Oyna";
 draw();
}

function loop(t){
 if(!running)return;

 if(keys.ArrowLeft || keys.a)player.x-=player.speed;
 if(keys.ArrowRight || keys.d)player.x+=player.speed;

 player.x=Math.max(18,Math.min(602,player.x));

 if((keys[" "] || keys.fire) && t-lastShot>260){
  bullets.push({x:player.x,y:player.y-20});
  lastShot=t;
 }

 if(t-lastSpawn>850){
  enemies.push({
   x:25+Math.random()*570,
   y:-15,
   r:15,
   speed:2+Math.random()*1.5
  });
  lastSpawn=t;
 }

 bullets.forEach(b=>b.y-=7);
 enemies.forEach(e=>e.y+=e.speed);

 bullets=bullets.filter(b=>b.y>-15);

 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i];

  const hit=bullets.findIndex(b=>
   Math.hypot(b.x-e.x,b.y-e.y)<e.r+5
  );

  if(hit>=0){
   bullets.splice(hit,1);
   enemies.splice(i,1);
   score+=10;
   scoreEl.textContent=score;
   continue;
  }

  if(e.y>420 ||
   Math.hypot(player.x-e.x,player.y-e.y)<e.r+15){

   enemies.splice(i,1);
   lives--;
   livesEl.textContent=lives;

   if(lives<=0){
    endGame();
    return;
   }
  }
 }

 draw();
 animation=requestAnimationFrame(loop);
}

function start(){
 cancelAnimationFrame(animation);
 reset();

 running=true;
 lastShot=0;
 lastSpawn=0;

 message.textContent="Düşmanları vur!";
 startBtn.disabled=true;

 animation=requestAnimationFrame(loop);
}

startBtn.onclick=start;

window.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight"," "].includes(e.key)){
  e.preventDefault();
 }
 keys[e.key]=true;
});

window.addEventListener("keyup",e=>{
 keys[e.key]=false;
});

function hold(id,key){
 const button=document.getElementById(id);

 button.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
 });

 ["pointerup","pointerleave","pointercancel"].forEach(event=>{
  button.addEventListener(event,()=>keys[key]=false);
 });
}

hold("left","ArrowLeft");
hold("right","ArrowRight");
hold("fire","fire");

reset();
draw();
</script>
</body>
</html>
