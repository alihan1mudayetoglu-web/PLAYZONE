<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balon Patlat | PLAYZONE</title><style>*{box-sizing:border-box}body{margin:0;background:#090d18;color:white;font:18px Arial;text-align:center}.top{padding:16px}#field{height:72vh;margin:0 14px;position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(#172340,#111827)}.balloon{position:absolute;border:0;border-radius:50% 50% 45% 45%;width:56px;height:68px;font-size:25px;cursor:pointer;box-shadow:inset -8px -7px 12px #0003}.balloon:after{content:'';position:absolute;left:26px;top:66px;height:14px;border-left:1px solid #ddd}button#start{background:#7957ff;color:white;border:0;border-radius:8px;padding:11px 18px;cursor:pointer}a{color:#b8a8ff}</style><div class="top"><h1>🎈 Balon Patlat</h1><p id="info">30 saniyede olabildiğince çok balon patlat!</p><button id="start">Başlat</button>　<a href="../../index.html">Ana sayfa</a></div><div id="field"></div><script>const field=document.querySelector('#field'),info=document.querySelector('#info');let score=0,left=30,clock,spawn;function makeBalloon(){const b=document.createElement('button');b.className='balloon';b.textContent='🎈';b.style.left=Math.random()*(field.clientWidth-65)+'px';b.style.top=Math.random()*(field.clientHeight-90)+'px';b.style.background=['#f35c83','#43c5aa','#ffc44d','#8c70f5'][Math.random()*4|0];b.onclick=()=>{score++;info.textContent='Puan: '+score+' · Kalan: '+left+' sn';b.remove()};field.append(b);setTimeout(()=>b.remove(),1800)}document.querySelector('#start').onclick=()=>{clearInterval(clock);clearInterval(spawn);field.replaceChildren();score=0;left=30;makeBalloon();spawn=setInterval(makeBalloon,650);clock=setInterval(()=>{left--;info.textContent='Puan: '+score+' · Kalan: '+left+' sn';if(left<=0){clearInterval(clock);clearInterval(spawn);field.replaceChildren();info.textContent='Süre bitti! Toplam puanın: '+score}},1000)}</script></html>
