<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tepki Testi | PLAYZONE</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090d18;color:white;font:17px Arial}.box{text-align:center;width:min(600px,90vw)}#pad{height:300px;border-radius:22px;background:#29344a;display:grid;place-items:center;font-size:30px;font-weight:bold;cursor:pointer;user-select:none}a{color:#b8a8ff}</style><div class="box"><h1>⚡ Tepki Testi</h1><p>Kutu yeşile dönünce hemen tıkla!</p><div id="pad">Başlamak için tıkla</div><p id="result">Erken tıklama yapma!</p><p><a href="../../index.html">PLAYZONE'a dön</a></p></div><script>const pad=document.querySelector('#pad'),out=document.querySelector('#result');let state='idle',start,timer;pad.onclick=()=>{if(state==='idle'){state='wait';pad.textContent='Bekle…';pad.style.background='#a33148';timer=setTimeout(()=>{state='ready';start=performance.now();pad.style.background='#22a879';pad.textContent='ŞİMDİ TIKLA!'},1000+Math.random()*3500)}else if(state==='wait'){clearTimeout(timer);state='idle';pad.style.background='#29344a';pad.textContent='Erken oldu! Tekrar tıkla';out.textContent='Yeşil yanmadan tıkladın.'}else{out.textContent='Tepki süren: '+Math.round(performance.now()-start)+' ms';state='idle';pad.style.background='#29344a';pad.textContent='Tekrar denemek için tıkla'}}</script></html>
