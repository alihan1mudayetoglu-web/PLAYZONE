<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taş Kağıt Makas</title><style>body{background:#090d18;color:white;font:18px Arial;display:grid;place-items:center;min-height:100vh;margin:0}.box{text-align:center;background:#111827;padding:30px;border-radius:18px}button{font-size:35px;margin:8px;padding:14px;border:0;border-radius:12px;cursor:pointer}a{color:#b8a8ff}</style><div class="box"><h1>✊ Taş Kağıt Makas</h1><p id="score">Sen 0 — 0 Bilgisayar</p><div id="result">İlk hamleni seç</div><button onclick="play('Taş')">✊</button><button onclick="play('Kağıt')">✋</button><button onclick="play('Makas')">✌️</button><p><a href="../../index.html">Ana sayfa</a></p></div><script>let a=0,b=0,n=0;function play(x){const c=['Taş','Kağıt','Makas'][Math.random()*3|0];n++;if(x!==c){if((x==='Taş'&&c==='Makas')||(x==='Kağıt'&&c==='Taş')||(x==='Makas'&&c==='Kağıt'))a++;else b++}document.querySelector('#result').textContent='Sen: '+x+' · Bilgisayar: '+c+' — '+(x===c?'Berabere':a+b===n?(a>b?'Sen kazandın!':'Bilgisayar kazandı!'):'');document.querySelector('#score').textContent='Sen '+a+' — '+b+' Bilgisayar · Tur '+n}</script></html>
