<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelime Karıştırma</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090d18;color:white;font:18px Arial}.box{text-align:center;background:#111827;padding:30px;border-radius:18px;width:min(440px,92vw)}input,button{padding:12px;border-radius:9px;border:0;margin:5px}button{background:#7957ff;color:white;cursor:pointer}a{color:#b8a8ff}#scramble{font-size:35px;letter-spacing:5px;color:#b8a8ff}</style><div class="box"><h1>🔤 Kelime Karıştırma</h1><p>Karışık harfleri doğru sıraya koy.</p><p id="scramble"></p><input id="answer" placeholder="Kelime"><button id="check">Kontrol et</button><button id="next">Başka kelime</button><p id="msg">Puan: 0</p><a href="../../index.html">Ana sayfa</a></div><script>const words=['oyun','kalem','kitap','masa','ekran','bulut','elma','yıldız','puzzle','arkadaş'];let word,points=0;function next(){word=words[Math.random()*words.length|0];let mix=word.split('').sort(()=>Math.random()-.5).join('');if(mix===word)mix=word.slice(1)+word[0];document.querySelector('#scramble').textContent=mix;document.querySelector('#answer').value='';document.querySelector('#msg').textContent='Puan: '+points}document.querySelector('#check').onclick=()=>{if(document.querySelector('#answer').value.trim().toLocaleLowerCase('tr')===word){points++;document.querySelector('#msg').textContent='Doğru bildin! Puan: '+points;next()}else document.querySelector('#msg').textContent='Tekrar dene! Puan: '+points};document.querySelector('#next').onclick=next;next()</script></html>
