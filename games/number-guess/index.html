<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sayı Tahmin | PLAYZONE</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090d18;color:#fff;font:17px Arial}.box{text-align:center;background:#111827;border:1px solid #303b53;border-radius:20px;padding:32px;max-width:440px}input,button{padding:12px;border-radius:9px;border:0;margin:5px}button{background:#7957ff;color:white;cursor:pointer}a{color:#b8a8ff}#msg{min-height:28px}</style><div class="box"><h1>🔢 Sayı Tahmin</h1><p>1–100 arasında bir sayı tuttum. Bulabilir misin?</p><input id="guess" type="number" min="1" max="100" placeholder="Tahminin"><button id="send">Tahmin et</button><p id="msg">Kalan hak: 7</p><button id="again">Yeni oyun</button><p><a href="../../index.html">PLAYZONE'a dön</a></p></div><script>let answer,tries;function reset(){answer=Math.floor(Math.random()*100)+1;tries=7;document.querySelector('#msg').textContent='Kalan hak: '+tries;document.querySelector('#guess').value=''}function play(){const n=Number(document.querySelector('#guess').value),m=document.querySelector('#msg');if(n<1||n>100)return;m.textContent=n===answer?'Bildin! 🎉 Yeni oyun için tıkla.':(n<answer?'Daha büyük! ':'Daha küçük! ')+( --tries>0?'Kalan hak: '+tries:'Bilemedin. Sayı '+answer+' idi. Yeni oyun başlat.');if(n===answer||tries===0)document.querySelector('#send').disabled=true}document.querySelector('#send').onclick=play;document.querySelector('#again').onclick=()=>{document.querySelector('#send').disabled=false;reset()};document.querySelector('#guess').onkeydown=e=>{if(e.key==='Enter')play()};reset()</script></html>
