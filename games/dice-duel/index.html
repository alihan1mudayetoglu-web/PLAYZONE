<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zar Düellosu</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090d18;color:white;font:20px Arial}.box{text-align:center;background:#111827;padding:30px;border-radius:18px}button{padding:12px 20px;background:#7957ff;color:white;border:0;border-radius:8px;cursor:pointer}a{color:#b8a8ff}#dice{font-size:65px}</style><div class="box"><h1>🎲 Zar Düellosu</h1><p id="dice">🎲　🎲</p><p id="result">Zar atıp bilgisayarı yen!</p><button id="roll">Zar at</button><p id="score">Sen 0 · Bilgisayar 0</p><a href="../../index.html">Ana sayfa</a></div><script>let me=0,pc=0;document.querySelector('#roll').onclick=()=>{const a=1+Math.random()*6|0,b=1+Math.random()*6|0;document.querySelector('#dice').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][a-1]+'　'+['⚀','⚁','⚂','⚃','⚄','⚅'][b-1];document.querySelector('#result').textContent=a===b?'Berabere!':a>b?'Kazandın!':'Bilgisayar kazandı!';if(a>b)me++;else if(b>a)pc++;document.querySelector('#score').textContent='Sen '+me+' · Bilgisayar '+pc}</script></html>
