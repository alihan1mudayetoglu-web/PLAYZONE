
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jump Hero | PLAYZONE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
 background:#090d18;
 color:white;
 font-family:Arial,sans-serif;
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px;
}

.container{
 width:100%;
 max-width:650px;
 text-align:center;
}

.back{
 display:inline-block;
 color:#aaa;
 text-decoration:none;
 margin-bottom:20px;
}

h1{font-size:36px;margin-bottom:8px}
h1 span{color:#7957ff}
.subtitle{color:#929bb0;margin-bottom:20px}

.scores{
 display:flex;
 gap:12px;
 margin-bottom:15px;
}

.score-box{
 flex:1;
 background:#151e30;
 border:1px solid #28344a;
 padding:13px;
 border-radius:10px;
}

.score-box p{font-size:12px;color:#929bb0;margin-bottom:7px}
.score-box strong{font-size:23px;color:#a58fff}

.game-area{
 position:relative;
 border:2px solid #34435c;
 border-radius:12px;
 overflow:hidden;
 background:#111827;
}

canvas{
 display:block;
 width:100%;
 height:auto;
 touch-action:manipulation;
}

.overlay{
 position:absolute;
 inset:0;
 background:#080d18dd;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 gap:15px;
}

.overlay.hidden{display:none}
.overlay h2{font-size:30px}
.overlay p{color:#b1b9cb}

button{
 border:0;
 cursor:pointer;
 font-weight:bold;
}

.main-btn{
 background:#7957ff;
 color:white;
 padding:14px 28px;
 border-radius:9px;
 font-size:15px;
}

.main-btn:hover{background:#9279ff}

.jump-btn{
 width:100%;
 margin-top:15px;
 padding:17px;
 background:#7957ff;
 color:white;
 border-radius:10px;
 font-size:17px;
 touch-action:none;
}

.tip{
 color:#929bb0;
 font-size:13px;
 margin-top:17px;
 line-height:1.7;
}
</style>
</head>

<body>

<div class="container">

<a href="../../index.html" class="back">← Ana Sayfaya Dön</a>

<h1>🦸 <span>Jump Hero</span></h1>
<p class="subtitle">Zıpla, engelleri aş ve rekor kır!</p>

<div class="scores">
 <div class="score-box">
  <p>SKOR</p>
  <strong id="score">0</strong>
 </div>
 <div class="score-box">
  <p>REKOR</p>
  <strong id="best">0</strong>
 </div>
</div>

<div class="game-area">
 <canvas id="game" width="600" height="300"></canvas>

 <div class="overlay" id="overlay">
  <h2 id="title">🦸 Jump Hero</h2>
  <p id="message">Engelleri aşmaya hazır mısın?</p>
  <button class="main-btn" id="start">Oyuna Başla</button>
 </div>
</div>

<button class="jump-btn" id="jump">⬆ ZIPLA</button>

<p class="tip">
 Bilgisayar: SPACE veya ↑ tuşu<br>
 Telefon: ZIPLA butonu veya ekrana dokun.
</p>

</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const overlay=document.getElementById("overlay");
const startBtn=document.getElementById("start");

const W=600,H=300;
const ground=250;

let player;
let obstacles=[];
let score=0;
let best=Number(localStorage.getItem("jumpHeroBest"))||0;
let speed=5;
let running=false;
let animation=null;
let frame=0;

bestEl.textContent=best;

function reset(){
 player={
  x:80,
  y:ground-42,
  w:38,
  h:42,
  vy:0,
  jumping:false
 };

 obstacles=[];
 score=0;
 speed=5;
 frame=0;
 scoreEl.textContent=score;
}

function jump(){
 if(!running)return;

 if(!player.jumping){
  player.vy=-12.5;
  player.jumping=true;
 }
}

function createObstacle(){
 const height=25+Math.random()*30;

 obstacles.push({
  x:W+20,
  y:ground-height,
  w:22+Math.random()*15,
  h:height
 });
}

function drawBackground(){
 const gradient=ctx.createLinearGradient(0,0,0,H);
 gradient.addColorStop(0,"#182442");
 gradient.addColorStop(1,"#30305b");

 ctx.fillStyle=gradient;
 ctx.fillRect(0,0,W,H);

 // Yıldızlar
 ctx.fillStyle="#ffffff55";

 for(let i=0;i<30;i++){
  const x=(i*97-frame*.3)%W;
  const y=(i*43)%190;
  ctx.fillRect(x,y,3,3);
 }

 // Zemin
 ctx.fillStyle="#202c45";
 ctx.fillRect(0,ground,W,H-ground);

 ctx.fillStyle="#7957ff";
 ctx.fillRect(0,ground,W,4);

 // Zemin çizgileri
 ctx.fillStyle="#526080";

 for(let i=0;i<15;i++){
  const x=(i*55-frame*speed)%W;
  ctx.fillRect(x,ground+25,25,3);
 }
}

function drawPlayer(){
 ctx.fillStyle="#a78bfa";
 ctx.beginPath();
 ctx.roundRect(player.x,player.y,player.w,player.h,8);
 ctx.fill();

 // Gözler
 ctx.fillStyle="white";
 ctx.fillRect(player.x+25,player.y+10,7,7);

 ctx.fillStyle="#252047";
 ctx.fillRect(player.x+29,player.y+12,3,3);

 // Ayaklar
 ctx.fillStyle="#7957ff";
 ctx.fillRect(player.x+5,player.y+player.h-3,10,8);
 ctx.fillRect(player.x+24,player.y+player.h-3,10,8);
}

function drawObstacles(){
 obstacles.forEach(ob=>{
  ctx.fillStyle="#ff637d";
  ctx.shadowColor="#ff637d";
  ctx.shadowBlur=10;

  ctx.beginPath();
  ctx.roundRect(ob.x,ob.y,ob.w,ob.h,5);
  ctx.fill();

  ctx.shadowBlur=0;
 });
}

function draw(){
 ctx.clearRect(0,0,W,H);
 drawBackground();
 drawObstacles();
 drawPlayer();
}

function update(){
 if(!running)return;

 frame++;

 // Yer çekimi
 player.vy+=0.55;
 player.y+=player.vy;

 if(player.y>=ground-player.h){
  player.y=ground-player.h;
  player.vy=0;
  player.jumping=false;
 }

 // Engel oluşturma
 if(frame%95===0){
  createObstacle();
 }

 // Engelleri hareket ettir
 obstacles.forEach(ob=>{
  ob.x-=speed;
 });

 obstacles=obstacles.filter(ob=>ob.x+ob.w>0);

 // Çarpışma
 for(const ob of obstacles){
  if(
   player.x+player.w-5>ob.x+3 &&
   player.x+5<ob.x+ob.w-3 &&
   player.y+player.h-4>ob.y+3
  ){
   endGame();
   return;
  }
 }

 // Skor
 if(frame%6===0){
  score++;
  scoreEl.textContent=score;
 }

 // Zorluk
 if(frame%500===0){
  speed=Math.min(speed+0.5,10);
 }

 if(score>best){
  best=score;
  bestEl.textContent=best;
  localStorage.setItem("jumpHeroBest",best);
 }

 draw();
 animation=requestAnimationFrame(update);
}

function startGame(){
 if(animation)cancelAnimationFrame(animation);

 reset();
 running=true;
 overlay.classList.add("hidden");
 draw();

 animation=requestAnimationFrame(update);
}

function endGame(){
 running=false;

 if(animation)cancelAnimationFrame(animation);

 document.getElementById("title").textContent="💥 Oyun Bitti!";
 document.getElementById("message").textContent="Skorun: "+score;
 startBtn.textContent="Tekrar Oyna";

 overlay.classList.remove("hidden");
 draw();
}

startBtn.addEventListener("click",startGame);

document.addEventListener("keydown",e=>{
 if(e.code==="Space"||e.code==="ArrowUp"){
  e.preventDefault();
  jump();
 }
});

document.getElementById("jump").addEventListener("pointerdown",e=>{
 e.preventDefault();
 jump();
});

canvas.addEventListener("pointerdown",jump);

reset();
draw();

</script>

</body>
</html>
