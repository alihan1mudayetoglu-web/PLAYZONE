<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hedef Vurma</title><style>*{box-sizing:border-box}body{margin:0;background:#090d18;color:white;font:18px Arial;text-align:center}.bar{padding:18px}#field{height:70vh;position:relative;margin:0 15px;background:#111827;border-radius:18px;overflow:hidden}#target{position:absolute;font-size:38px;border:0;background:none;cursor:pointer}button{padding:10px 18px;background:#7957ff;color:white;border:0;border-radius:9px;cursor:pointer}a{color:#b8a8ff}</style><div class="bar"><h1>🎯 Hedef Vurma</h1><p id="status">Başlat'a tıklayıp 30 saniyede hedefleri yakala.</p><button id="start">Başlat</button>　<a href="../../index.html">Ana sayfa</a></div><div id="field"><button id="target" hidden>🎯</button></div><script>let score=0,left=30,timer;const t=document.querySelector('#target'),s=document.querySelector('#status'),f=document.querySelector('#field');function move(){t.style.left=Math.random()*(f.clientWidth-55)+'px';t.style.top=Math.random()*(f.clientHeight-55)+'px'}document.querySelector('#start').onclick=()=>{score=0;left=30;t.hidden=false;move();clearInterval(timer);timer=setInterval(()=>{left--;s.textContent='Puan: '+score+' · Kalan: '+left+' sn';if(left<=0){clearInterval(timer);t.hidden=true;s.textContent='Süre bitti! Puanın: '+score}},1000);s.textContent='Puan: 0 · Kalan: 30 sn'};t.onclick=()=>{score++;move();s.textContent='Puan: '+score+' · Kalan: '+left+' sn'}</script></html>
