<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Renk Hafızası</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090d18;color:white;font:18px Arial}.box{text-align:center}.colors{display:grid;grid-template-columns:repeat(2,120px);gap:12px;margin:22px}.c{height:110px;border:0;border-radius:16px;opacity:.65;cursor:pointer}.on{opacity:1;filter:brightness(1.5)}button#start{padding:12px;background:#7957ff;color:#fff;border:0;border-radius:8px}a{color:#b8a8ff}</style><div class="box"><h1>🟢 Renk Hafızası</h1><p id="msg">Sırayı takip edip tekrarla.</p><div class="colors"><button class="c" style="background:#e8415b"></button><button class="c" style="background:#32c48d"></button><button class="c" style="background:#3788f5"></button><button class="c" style="background:#f1bd45"></button></div><button id="start">Başlat</button><p><a href="../../index.html">Ana sayfa</a></p></div><script>const pads=[...document.querySelectorAll('.c')],msg=document.querySelector('#msg');let seq=[],input=[],locked=true,level=0;function flash(i){pads[i].classList.add('on');setTimeout(()=>pads[i].classList.remove('on'),350)}function show(){locked=true;let i=0;const timer=setInterval(()=>{if(i>=seq.length){clearInterval(timer);locked=false;input=[];msg.textContent='Sıra sende · Seviye '+level;return}flash(seq[i++])},650)}function add(){seq.push(Math.random()*4|0);level++;show()}pads.forEach((p,i)=>p.onclick=()=>{if(locked)return;flash(i);input.push(i);if(input[input.length-1]!==seq[input.length-1]){msg.textContent='Yanlış sıra! Seviye: '+(level-1);locked=true;return}if(input.length===seq.length)setTimeout(add,500)});document.querySelector('#start').onclick=()=>{seq=[];level=0;msg.textContent='Dikkatle izle!';add()}</script></html>
