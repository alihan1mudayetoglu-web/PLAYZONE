<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Sudoku</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090d18;color:white;font:18px Arial}.box{text-align:center;background:#111827;padding:24px;border-radius:18px}#grid{display:grid;grid-template-columns:repeat(4,60px);gap:4px;margin:20px auto}input{width:58px;height:58px;text-align:center;font-size:24px;background:#202c42;color:white;border:1px solid #59647a;border-radius:7px}button{padding:11px;background:#7957ff;color:white;border:0;border-radius:8px;cursor:pointer}a{color:#b8a8ff}</style><div class="box"><h1>🔐 Mini Sudoku</h1><p>Her satır ve sütunda 1–4 birer kez bulunmalı.</p><div id="grid"></div><button id="check">Kontrol et</button><p id="msg"></p><a href="../../index.html">Ana sayfa</a></div><script>const solution=[1,2,3,4,3,4,1,2,2,1,4,3,4,3,2,1],fixed=[0,3,5,6,9,10,12,15],grid=document.querySelector('#grid');solution.forEach((n,i)=>{let x=document.createElement('input');x.maxLength=1;x.inputMode='numeric';if(fixed.includes(i)){x.value=n;x.disabled=true}x.dataset.answer=n;grid.append(x)});document.querySelector('#check').onclick=()=>{const cells=[...grid.children];document.querySelector('#msg').textContent=cells.every(x=>Number(x.value)===Number(x.dataset.answer))?'Tebrikler, çözdün! 🎉':'Henüz doğru değil, tekrar dene.'}</script></html>
